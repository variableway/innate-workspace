[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memweave"
version = "0.1.0"
description = "SQLite Local-First AI 记忆层：混合搜索 + 时间衰减 + MMR"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# 可选增强：安装后自动使用 all-MiniLM-L6-v2 语义向量，否则降级为确定性哈希向量
semantic = ["sentence-transformers>=2.2"]
test = ["pytest>=7"]

[project.scripts]
memweave = "memweave.cli:main"

[tool.setuptools.packages.find]
include = ["memweave*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
