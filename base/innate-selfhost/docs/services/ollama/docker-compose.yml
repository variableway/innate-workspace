# Ollama — 本地 LLM 推理
# 文档：https://ollama.com/

services:
  ollama:
    image: ollama/ollama:latest
    container_name: selfhost-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-0.0.0.0:11434}
    networks:
      - selfhost-net
    # GPU 支持（取消注释以启用）
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  ollama-data:

networks:
  selfhost-net:
    external: true
