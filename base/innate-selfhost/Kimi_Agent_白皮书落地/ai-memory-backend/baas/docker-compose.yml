# ==============================================================================
# baas —— 去 Supabase 化自托管 BaaS（白皮书 2.2 Skill 2 / 2.5 方案 B / Tier 2）
#
# 组件对照（替代 Supabase）：
#   db        ParadeDB (PostgreSQL + pgvector + pg_search) -> Supabase Postgres
#   postgrest PostgREST                                    -> Supabase REST API
#   auth      Authentik (server + worker + redis)          -> Supabase Auth (GoTrue)
#   realtime  Mercure (SSE)                                -> Supabase Realtime
#   storage   MinIO (S3 兼容)                              -> Supabase Storage
#   gateway   Traefik                                      -> Supabase Kong 网关
# ==============================================================================

services:

  # ---------- 数据库：ParadeDB（预装 pgvector + pg_search）----------
  db:
    image: paradedb/paradedb:latest
    container_name: baas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    volumes:
      # 数据库数据持久化
      - pgdata:/var/lib/postgresql/data
      # 初始化脚本：建扩展、多租户示例表、RLS 策略（仅首次启动执行）
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- REST API：PostgREST（自动把数据库变成 RESTful API）----------
  postgrest:
    image: postgrest/postgrest:latest
    container_name: baas-postgrest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      # JWT 密钥与 Authentik 签发的 token 对齐（白皮书 2.2 Skill 2）
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?请在 .env 中设置 PGRST_JWT_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # 网关路由：http://localhost:8000/api/* -> PostgREST
      - "traefik.http.routers.postgrest.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.postgrest.entrypoints=web"
      - "traefik.http.routers.postgrest.middlewares=strip-api"
      - "traefik.http.middlewares.strip-api.stripprefix.prefixes=/api"
      - "traefik.http.services.postgrest.loadbalancer.server.port=3000"

  # ---------- Redis：Authentik 的缓存/队列依赖（valkey，Redis 兼容）----------
  redis:
    image: valkey/valkey:latest
    container_name: baas-redis
    restart: unless-stopped
    command: valkey-server --save 60 1 --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------- 认证：Authentik（替代 GoTrue，OIDC/SAML/MFA/多租户）----------
  auth:
    image: ghcr.io/goauthentik/server:latest
    container_name: baas-authentik
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?请在 .env 中设置 AUTHENTIK_SECRET_KEY}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: db
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB_NAME:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER:-postgres}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      # 初始管理员账号（仅首次初始化生效）
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@example.com}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-admin}
    ports:
      - "9002:9000"    # Authentik HTTP 直连端口
      - "9443:9443"    # Authentik HTTPS
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # 网关路由：http://localhost:8000/auth/* -> Authentik
      - "traefik.http.routers.authentik.rule=PathPrefix(`/auth`)"
      - "traefik.http.routers.authentik.entrypoints=web"
      - "traefik.http.services.authentik.loadbalancer.server.port=9000"

  # Authentik 后台任务 worker（与 server 同镜像，不同 command）
  auth-worker:
    image: ghcr.io/goauthentik/server:latest
    container_name: baas-authentik-worker
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: db
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB_NAME:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER:-postgres}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------- 实时推送：Mercure（SSE，替代 Supabase Realtime）----------
  realtime:
    image: dunglas/mercure:latest
    container_name: baas-mercure
    restart: unless-stopped
    environment:
      # JWT 签名密钥（发布/订阅校验，生产请换强随机值）
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_KEY:?请在 .env 中设置 MERCURE_JWT_KEY}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_KEY}
      SERVER_NAME: ":80"
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins *
        anonymous
    ports:
      - "8001:80"
    labels:
      - "traefik.enable=true"
      # 网关路由：http://localhost:8000/realtime/* -> Mercure
      - "traefik.http.routers.mercure.rule=PathPrefix(`/realtime`)"
      - "traefik.http.routers.mercure.entrypoints=web"
      - "traefik.http.services.mercure.loadbalancer.server.port=80"

  # ---------- 对象存储：MinIO（S3 兼容，替代 Supabase Storage）----------
  storage:
    image: minio/minio:latest
    container_name: baas-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请在 .env 中设置 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 .env 中设置 MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web 控制台
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      # 网关路由：http://localhost:8000/minio/* -> MinIO 控制台
      - "traefik.http.routers.minio.rule=PathPrefix(`/minio`)"
      - "traefik.http.routers.minio.entrypoints=web"
      - "traefik.http.services.minio.loadbalancer.server.port=9001"

  # 初始化 job：创建默认桶（可选，跑完即退出，restart: "no"）
  minio-init:
    image: minio/mc:latest
    container_name: baas-minio-init
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb -p local/public || true;
      mc mb -p local/private || true;
      mc anonymous set download local/public || true;
      echo 'MinIO 桶初始化完成：public（公开下载）/ private（私有）';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    depends_on:
      storage:
        condition: service_healthy

  # ---------- 网关：Traefik（替代 Kong，统一入口 8000 端口）----------
  gateway:
    image: traefik:latest
    container_name: baas-traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:8000"
      - "--api.insecure=true"
    ports:
      - "8000:8000"   # 统一入口：/api -> PostgREST, /auth -> Authentik, /minio -> MinIO, /realtime -> Mercure
      - "8080:8080"   # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  pgdata:              # PostgreSQL/ParadeDB 数据
  redisdata:           # Valkey/Redis 数据
  authentik_media:     # Authentik 媒体文件
  authentik_templates: # Authentik 自定义模板
  miniodata:           # MinIO 对象数据
