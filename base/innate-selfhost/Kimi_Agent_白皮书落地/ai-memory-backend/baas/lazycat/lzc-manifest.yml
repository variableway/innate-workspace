# 懒猫微服运行结构配置 —— 去 Supabase 化自托管 BaaS
# 由 docker-compose.yml 按官方转换规则改写：
#   environment/ports/volumes/image  →  environment/ingress/binds/image
# 安装启动前系统会用 Go text/template 渲染本文件，
# stable_secret 会为每个安装实例生成稳定不变的随机密码（无需用户手动配置）。
lzc-sdk-version: '0.1'

application:
  subdomain: baas            # 访问入口：https://baas.<你的微服域名>/
  routes:
    # 懒猫默认 HTTPS 入口的路径分流
    - /api/=http://postgrest.cloud.lazycat.app.selfhost-baas.lzcapp:3000/   # REST API（可选层，见 README）
    - /auth/=http://authentik.cloud.lazycat.app.selfhost-baas.lzcapp:9000/  # 认证服务
    - /realtime/=http://realtime.cloud.lazycat.app.selfhost-baas.lzcapp:80/ # Mercure SSE 实时
    - /minio/=http://storage.cloud.lazycat.app.selfhost-baas.lzcapp:9001/   # MinIO 控制台
    - /=http://storage.cloud.lazycat.app.selfhost-baas.lzcapp:9001/         # 默认打开 MinIO 控制台
  ingress:
    # 4 层转发：数据库端口暴露给局域网内可信客户端（不需要可删除整段）
    - protocol: tcp
      port: 15432
      service: db

services:
  # ── 数据库：ParadeDB = PostgreSQL + pgvector + pg_search（全文） ──
  db:
    image: paradedb/paradedb:latest
    binds:
      - /lzcapp/var/pgdata:/var/lib/postgresql/data
      - /lzcapp/pkg/content/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_PASSWORD={{ stable_secret "pg_password" }}
      - POSTGRES_DB=postgres
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ── REST API 层（可选：不需要自动 REST 时删除整个 postgrest 服务和 /api/ 路由即可） ──
  postgrest:
    image: postgrest/postgrest:latest
    environment:
      - PGRST_DB_URI=postgres://postgres:{{ stable_secret "pg_password" }}@db.cloud.lazycat.app.selfhost-baas.lzcapp:5432/postgres
      - PGRST_DB_SCHEMA=public
      - PGRST_JWT_SECRET={{ stable_secret "jwt_secret" }}
      - PGRST_DB_ANON_ROLE=anon

  # ── 认证：Authentik（替代 Supabase GoTrue），依赖 db 与 redis ──
  redis:
    image: valkey/valkey:8
    binds:
      - /lzcapp/var/redis:/data

  authentik:
    image: ghcr.io/goauthentik/server:latest
    command: server
    binds:
      - /lzcapp/var/authentik/media:/media
      - /lzcapp/var/authentik/templates:/templates
    environment:
      - AUTHENTIK_SECRET_KEY={{ stable_secret "authentik_secret" }}
      - AUTHENTIK_REDIS__HOST=redis.cloud.lazycat.app.selfhost-baas.lzcapp
      - AUTHENTIK_POSTGRESQL__HOST=db.cloud.lazycat.app.selfhost-baas.lzcapp
      - AUTHENTIK_POSTGRESQL__USER=postgres
      - AUTHENTIK_POSTGRESQL__NAME=authentik
      - AUTHENTIK_POSTGRESQL__PASSWORD={{ stable_secret "pg_password" }}

  authentik-worker:
    image: ghcr.io/goauthentik/server:latest
    command: worker
    binds:
      - /lzcapp/var/authentik/media:/media
      - /lzcapp/var/authentik/templates:/templates
    environment:
      - AUTHENTIK_SECRET_KEY={{ stable_secret "authentik_secret" }}
      - AUTHENTIK_REDIS__HOST=redis.cloud.lazycat.app.selfhost-baas.lzcapp
      - AUTHENTIK_POSTGRESQL__HOST=db.cloud.lazycat.app.selfhost-baas.lzcapp
      - AUTHENTIK_POSTGRESQL__USER=postgres
      - AUTHENTIK_POSTGRESQL__NAME=authentik
      - AUTHENTIK_POSTGRESQL__PASSWORD={{ stable_secret "pg_password" }}

  # ── 存储：MinIO（替代 Supabase Storage）──
  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    binds:
      - /lzcapp/var/minio:/data
    environment:
      - MINIO_ROOT_USER={{ stable_secret "minio_user" }}
      - MINIO_ROOT_PASSWORD={{ stable_secret "minio_password" }}

  # ── 实时：Mercure SSE（替代 Supabase Realtime）──
  realtime:
    image: dunglas/mercure:latest
    environment:
      - SERVER_NAME=:80
      - MERCURE_PUBLISHER_JWT_KEY={{ stable_secret "mercure_jwt" }}
      - MERCURE_SUBSCRIBER_JWT_KEY={{ stable_secret "mercure_jwt" }}
      - MERCURE_EXTRA_DIRECTIVES=anonymous
