# 项目注册表
# 由 scripts/sync-registry.py 扫描同步；也可手工追加。
# clone.py 会读取此文件，按 path 字段 clone 到对应目录

projects:
  # === skills ===
  - name: devops-skill
    repo: https://github.com/qdriven/devops-skill.git
    path: skills/devops-skill
    desc: 开发工作流相关的 AI Agent Skill 集合（git-workflow, git-pr, local-workflow 等）

  - name: figures-skill
    repo: https://github.com/qdriven/figures-skill.git
    path: skills/figures-skill
    desc: 人物思想蒸馏与多角色人格（SOUL）Skill 集合

  - name: fin-skills
    repo: https://github.com/qdriven/fin-skills.git
    path: skills/fin-skills
    desc: 金融领域的 AI 编程助手 Skill 合集 -- 把分散在各类数据源里的金融数据，封装成 AI 助手直接能用的工具集。

  - name: fire-skills
    repo: https://github.com/variableway/fire-skills.git
    path: skills/fire-skills
    desc: Personal Skill Workspace + 通用 Skill Manager

  - name: presentation-skills
    repo: https://github.com/qdriven/presentation-skills.git
    path: skills/presentation-skills
    desc: Slides、PPT、文档、数据报告等 Presentation 相关 Skill

  - name: sdlc-skills
    repo: https://github.com/qdriven/sdlc-skills.git
    path: skills/sdlc-skills
    desc: 软件开发生命周期（Software Development Life Cycle）技能集合，为 AI Agent 提供覆盖完整软件开发流程的专业能力。

  - name: wip-skills
    repo: https://github.com/qdriven/wip-skills.git
    path: skills/wip-skills
    desc: 这是一个用来实验SKILL的暂时仓库。

  # === base ===
  - name: innate-fe-base
    repo: https://github.com/variableway/innate-fe-templates.git
    path: base/innate-fe-base
    desc: Innate 前端模板项目集合

  # === projects ===
  - name: innate-tutor
    repo: https://github.com/variableway/innate-tutor.git
    path: projects/innate-tutor
    desc: AI Interactive Education 产品，整合 DeepTutor 与 OpenMAIC

  - name: Instatic
    repo: https://github.com/CoreBunch/Instatic.git
    path: projects/references/Instatic
    desc: 参考项目

  - name: reset-from-zero
    repo: https://github.com/variableway/reset-from-zero.git
    path: projects/reset-from-zero
    desc: AI Agent 辅助的项目分析与重构集合

  - name: innate-aiswitcher
    repo: https://github.com/variableway/innate-aiswitcher.git
    path: projects/tooling/innate-aiswitcher
    desc: 本地 LLM Provider 切换器，Go + PocketBase

  - name: AgentTODO
    repo: https://github.com/alanhsun/AgentTODO.git
    path: projects/agent-kanban/references/AgentTODO
    desc: agent-kanban 参考项目

  - name: LobsterBoard
    repo: https://github.com/Curbob/LobsterBoard.git
    path: projects/agent-kanban/references/LobsterBoard
    desc: agent-kanban 参考项目
