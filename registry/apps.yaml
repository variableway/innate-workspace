  - name: Understand-Anything
    repo: https://github.com/Egonex-AI/Understand-Anything.git
    path: skills/wip-skills/wip/Understand-Anything
    desc: Innate base/template projects

  - name: WebSite-Cloner
    repo: https://github.com/MainRoute-Core/WebSite-Cloner.git
